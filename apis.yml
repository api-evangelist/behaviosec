name: BehavioSec
description: >-
  BehavioSec is a behavioral biometrics and behavioral intelligence platform that continuously
  authenticates users and detects fraud by analyzing how people interact with digital environments —
  mouse movements, typing rhythm and cadence, touch gestures, and device handling — producing
  real-time, explainable risk scores. Originally a Swedish company spun out of research at Luleå
  University of Technology, BehavioSec was acquired by LexisNexis Risk Solutions in 2022 and is now
  delivered as part of the LexisNexis Dynamic Decision Platform, integrating with ThreatMetrix for
  combined device and behavioral intelligence. It detects account takeover, bots, remote access tool
  (RAT) fraud, and social-engineering scams across financial services, ecommerce, gaming,
  telecommunications, and travel. Access is via an enterprise API; there is no public developer portal.
